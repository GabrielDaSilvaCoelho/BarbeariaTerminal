spring.application.name=barberproapi
server.port=8080

# ──────────────────────────────────────────
# PostgreSQL
# ──────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barberpro_spring}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────
# RabbitMQ
# ──────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# ──────────────────────────────────────────
# JWT  — NUNCA commitar a chave real em texto plano
# Em produção: export JWT_SECRET=sua-chave-super-secreta-aqui
# ──────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:barberpro-super-secret-key-2026-projeto-integrador}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ──────────────────────────────────────────
# CORS
# ──────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}