name: Backend CI - BarberPro

on:
  push:
    branches:
      - main
      - migracao
  pull_request:
    branches:
      - main
      - migracao

jobs:
  test-backend:
    name: Rodar testes do backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: barberpro_spring
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d barberpro_spring"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        working-directory: Backend/barberproapi
        run: chmod +x ./mvnw

      - name: Rodar testes com Maven
        working-directory: Backend/barberproapi
        env:
          DB_URL: jdbc:postgresql://localhost:5432/barberpro_spring
          DB_USER: postgres
          DB_PASSWORD: 1234
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: guest
          RABBITMQ_PASS: guest
          JWT_SECRET: barberpro-super-secret-key-2026-projeto-integrador
          JWT_EXPIRATION_MS: 86400000
        run: ./mvnw -B test

      - name: Salvar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Backend/barberproapi/target/surefire-reports/

      - name: Salvar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Backend/barberproapi/target/site/jacoco/